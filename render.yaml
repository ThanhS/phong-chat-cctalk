# Render Blueprint — triển khai token-server cho phòng chat ccTalk lên Render miễn phí.
# Cách dùng: mở https://render.com/deploy?repo=https://github.com/ThanhS/phong-chat-cctalk
# rồi đăng nhập Render bằng GitHub, điền các biến môi trường được hỏi, bấm Deploy.
# Render cấp địa chỉ HTTPS miễn phí dạng https://cctalk-token-server.onrender.com
# Trang phòng chat (GitHub Pages) sẽ gọi vào địa chỉ này để đăng nhập + xin token voice.
#
# Lưu ý gói miễn phí: máy chủ ngủ sau 15 phút không ai dùng, lần gọi đầu tiên
# sau đó mất ~30-60 giây để tỉnh lại (lần đăng nhập đầu sau khi nghỉ sẽ chậm).
# Từ v3.6: đặt DATABASE_URL (chuỗi kết nối Postgres của Neon, vùng Singapore)
# thì tài khoản tự đăng ký, mã số, điểm, áo BĐH và phòng tự tạo được lưu bền
# trên Neon, không còn mất khi máy chủ khởi động lại. Không đặt DATABASE_URL
# thì vẫn như cũ: tài khoản gieo lại từ biến môi trường mỗi lần khởi động,
# nick đăng ký qua /register sẽ mất khi máy chủ restart.
services:
  - type: web
    name: cctalk-token-server
    env: node
    region: singapore
    plan: free
    rootDir: token-server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      # 3 giá trị lấy trong dashboard LiveKit Cloud (giữ kín, không gửi qua chat):
      - key: LIVEKIT_URL
        sync: false
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false
      # Secret ký session đăng nhập — Render tự sinh, không cần điền:
      - key: SESSION_SECRET
        generateValue: true
      - key: SESSION_TTL
        value: 6h
      # Chế độ cũ (client tự khai rank) luôn tắt:
      - key: ALLOW_LEGACY_TOKEN
        value: "0"
      # Chuỗi kết nối Postgres của Neon (v3.6) — dán từ dashboard Neon
      # (project vùng Singapore, dạng postgres://user:pass@host/db?sslmode=require).
      # Có biến này thì tài khoản/điểm/phòng tự tạo lưu bền, không mất khi
      # restart. Để trống thì máy chủ vẫn chạy, lưu file như cũ.
      - key: DATABASE_URL
        sync: false
      # Mật khẩu gieo tài khoản demo ở lần khởi động đầu (đặt mật khẩu mạnh;
      # THANH_PASSWORD có thể để trống nếu không dùng nick thanh):
      - key: ADMIN_PASSWORD
        sync: false
      - key: BDH_PASSWORD
        sync: false
      - key: THANH_PASSWORD
        sync: false
      - key: TEST_PASSWORD
        sync: false
